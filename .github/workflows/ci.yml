name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10.x crashes resolving vitest's optional peers; match engines.npm.
      - run: npx -y npm@11.21.0 ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
